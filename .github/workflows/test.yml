# Runs both test suites and the sync check on every push and pull request.
# Windows, like the devices this setup runs on; the generated files are made first, as on a new device.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node _ai/sync.mjs work --tools claude,kiro,copilot
      - run: node _ai/sync.mjs --check
      - run: node --test "_ai/**/*.test.mjs"
      - run: npm ci
        working-directory: setup-ui
      - run: npm test
        working-directory: setup-ui
      - run: npm run build
        working-directory: setup-ui
